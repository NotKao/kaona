<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi Vocab Quest - ทายคำศัพท์ภาษาจีน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Mali:wght@500;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 50%, #feebc8 100%);
            min-height: 100vh;
        }
        .font-chinese {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .font-cute {
            font-family: 'Mali', cursive;
        }
        .bounce-gentle {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .pulse-subtle {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 min-h-screen text-slate-800">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center bg-white/80 backdrop-blur-md p-4 rounded-2xl shadow-sm mb-4 border border-rose-100">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🐼</span>
            <div>
                <h1 class="font-cute font-bold text-lg text-rose-600 leading-tight">Chibi Vocab Quest</h1>
                <p class="text-xs text-slate-500">ทายคำศัพท์ภาษาจีนสุดสนุก</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="sound-btn" onclick="toggleSound()" class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center hover:bg-rose-200 transition">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button onclick="showMenu()" class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 transition">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center relative">

        <!-- SCREEN 1: MENU SCREEN -->
        <div id="screen-menu" class="w-full bg-white rounded-3xl shadow-xl p-6 border-4 border-rose-200 flex flex-col items-center text-center my-auto transition-all">
            <!-- Mascot Preview -->
            <div class="relative mb-4">
                <div class="w-28 h-28 bg-rose-100 rounded-full flex items-center justify-center border-4 border-rose-300 shadow-inner">
                    <svg id="mascot-menu-svg" class="w-24 h-24 bounce-gentle" viewBox="0 0 100 100">
                        <!-- Panda Mascot -->
                        <circle cx="20" cy="25" r="14" fill="#2d3748" />
                        <circle cx="80" cy="25" r="14" fill="#2d3748" />
                        <circle cx="50" cy="50" r="35" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
                        <ellipse cx="35" cy="48" rx="8" ry="12" fill="#2d3748" transform="rotate(-15 35 48)" />
                        <ellipse cx="65" cy="48" rx="8" ry="12" fill="#2d3748" transform="rotate(15 65 48)" />
                        <circle cx="36" cy="46" r="3" fill="#ffffff" />
                        <circle cx="64" cy="46" r="3" fill="#ffffff" />
                        <ellipse cx="50" cy="60" rx="5" ry="3" fill="#2d3748" />
                        <path d="M 45 66 Q 50 72 55 66" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round" />
                        <ellipse cx="28" cy="58" rx="5" ry="3" fill="#fbb6ce" opacity="0.6" />
                        <ellipse cx="72" cy="58" rx="5" ry="3" fill="#fbb6ce" opacity="0.6" />
                    </svg>
                </div>
                <span class="absolute -bottom-2 right-0 bg-yellow-400 text-yellow-900 text-xs font-bold px-2 py-0.5 rounded-full border border-yellow-500 shadow-sm">
                    ✨ หมีน้อยพู่โป้
                </span>
            </div>

            <h2 class="text-2xl font-bold text-slate-800 mb-1 font-cute">พร้อมลุยภาษาจีนหรือยัง?</h2>
            <p class="text-xs text-slate-500 mb-6">เลือกหมวดหมู่และโหมดการเล่นเพื่อเริ่มสนุกได้เลย!</p>

            <!-- Mode Selection -->
            <div class="w-full mb-4">
                <label class="block text-left text-xs font-bold text-slate-600 mb-1">🎮 โหมดการตอบ:</label>
                <select id="game-mode" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-rose-400">
                    <option value="cn-th">ตัวจีน ➔ คำแปลไทย</option>
                    <option value="pinyin-th">พินอิน (Pinyin) ➔ คำแปลไทย</option>
                    <option value="th-cn">คำแปลไทย ➔ ตัวจีน</option>
                </select>
            </div>

            <!-- Category Selection -->
            <div class="w-full mb-6">
                <label class="block text-left text-xs font-bold text-slate-600 mb-1">📚 หมวดหมู่คำศัพท์:</label>
                <div class="grid grid-cols-2 gap-2" id="category-selector">
                    <!-- Categories rendered via JS -->
                </div>
            </div>

            <button onclick="startGame()" class="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-rose-200 transform active:scale-95 transition flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> เริ่มเล่นเกม
            </button>

            <div class="mt-4 text-xs text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-trophy text-amber-400"></i> คะแนนสูงสุด: <span id="high-score" class="font-bold text-slate-600">0</span>
            </div>
        </div>

        <!-- SCREEN 2: GAMEPLAY SCREEN -->
        <div id="screen-game" class="w-full bg-white rounded-3xl shadow-xl p-5 border-4 border-rose-200 flex flex-col items-center hidden relative transition-all">
            
            <!-- Top Status Bar -->
            <div class="w-full flex justify-between items-center mb-4 text-sm font-bold bg-rose-50/80 p-2.5 rounded-2xl border border-rose-100">
                <div class="flex items-center gap-1.5 text-rose-600">
                    <i class="fa-solid fa-heart text-rose-500"></i>
                    <span id="lives-count">3</span>
                </div>
                <div class="flex items-center gap-1.5 text-amber-600">
                    <i class="fa-solid fa-star text-amber-500"></i>
                    <span id="score-count">0</span>
                </div>
                <div class="flex items-center gap-1.5 text-indigo-600">
                    <i class="fa-solid fa-fire text-indigo-500"></i>
                    <span>Streak: <span id="streak-count">0</span></span>
                </div>
            </div>

            <!-- Mascot Character Dynamic Display -->
            <div class="relative mb-3">
                <div id="mascot-box" class="w-24 h-24 bg-gradient-to-b from-rose-50 to-pink-100 rounded-full flex items-center justify-center border-4 border-white shadow-md relative overflow-hidden">
                    <!-- SVG Mascot Dynamic Faces -->
                    <svg id="mascot-game-svg" class="w-20 h-20 transition-all duration-300" viewBox="0 0 100 100">
                        <!-- Ears -->
                        <circle cx="20" cy="25" r="14" fill="#2d3748" />
                        <circle cx="80" cy="25" r="14" fill="#2d3748" />
                        <!-- Head -->
                        <circle cx="50" cy="50" r="35" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
                        
                        <!-- Eyes Base -->
                        <ellipse cx="35" cy="48" rx="8" ry="12" fill="#2d3748" transform="rotate(-15 35 48)" />
                        <ellipse cx="65" cy="48" rx="8" ry="12" fill="#2d3748" transform="rotate(15 65 48)" />
                        
                        <!-- Eye Pupil (Normal State) -->
                        <g id="mascot-eyes-normal">
                            <circle cx="36" cy="46" r="3" fill="#ffffff" />
                            <circle cx="64" cy="46" r="3" fill="#ffffff" />
                        </g>

                        <!-- Eye Happy State (Hidden by default) -->
                        <g id="mascot-eyes-happy" class="hidden">
                            <path d="M 30 48 Q 35 40 40 48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
                            <path d="M 60 48 Q 65 40 70 48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
                        </g>

                        <!-- Eye Sad State (Hidden by default) -->
                        <g id="ma
