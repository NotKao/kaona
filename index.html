<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chinese Vocab Fruit Ninja - นินจาคำศัพท์จีน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: 'Sarabun', system-ui, -apple-system, sans-serif;
            background-color: #1a0f07;
        }
        canvas {
            display: block;
        }
        @keyframes damageFlash {
            0% { opacity: 0.6; }
            100% { opacity: 0; }
        }
        .damage-overlay {
            animation: damageFlash 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative">

    <!-- เอฟเฟกต์หน้าจอกระพริบสีแดงเมื่อเสียชีวิต -->
    <div id="damage-flash" class="absolute inset-0 bg-red-600/40 pointer-events-none z-30 opacity-0"></div>

    <!-- UI Overlay ด้านบน -->
    <div id="ui-overlay" class="absolute top-0 left-0 w-full p-4 flex flex-col items-center justify-between pointer-events-none z-10">
        <!-- กล่องเป้าหมายคำศัพท์ไทย -->
        <div class="bg-amber-950/85 border-2 border-amber-500/80 rounded-2xl px-6 py-3 shadow-2xl backdrop-blur-md text-center max-w-xs sm:max-w-md w-full my-2">
            <span class="text-xs uppercase tracking-widest text-amber-300 font-bold block mb-1">🎯 คำแปลภาษาไทย (ฟันผลไม้ที่มีอักษรจีนตรงกัน)</span>
            <div id="target-word" class="text-2xl sm:text-4xl font-extrabold text-white drop-shadow-[0_2px_10px_rgba(245,158,11,0.6)]">
                ---
            </div>
            <div id="target-pinyin" class="text-sm sm:text-base text-amber-200/90 font-medium italic">
                ---
            </div>
            <!-- แสดงจำนวนรอบทบทวนคำศัพท์ชุดเดิม -->
            <div id="set-progress" class="text-xs text-amber-300/80 mt-1 font-semibold">
                ทบทวนคำศัพท์ในชุด: 1/3
            </div>
        </div>

        <!-- แถบสถานะ คะแนน และ ชีวิต (5 ชีวิต) -->
        <div class="w-full max-w-md flex justify-between items-center px-2">
            <div class="bg-amber-950/80 px-4 py-2 rounded-xl border border-amber-700/60 text-white font-bold text-lg flex items-center gap-2 shadow-lg backdrop-blur-sm">
                <span>🏆 คะแนน:</span>
                <span id="score-val" class="text-amber-400 text-2xl font-black">0</span>
            </div>

            <div id="lives-container" class="flex gap-1 text-xl sm:text-2xl filter drop-shadow-md bg-black/40 px-3 py-1.5 rounded-xl backdrop-blur-sm">
                <span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span>
            </div>
        </div>
    </div>

    <!-- หน้าต่าง Game Over -->
    <div id="game-over-modal" class="absolute inset-0 bg-black/85 backdrop-blur-md z-20 flex flex-col justify-center items-center text-white hidden p-4">
        <div class="bg-stone-900 border-2 border-red-500/80 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h1 id="game-over-title" class="text-4xl font-extrabold text-red-500 mb-2">เกมจบลงแล้ว!</h1>
            <p id="game-over-reason" class="text-stone-300 mb-6 text-sm">ชีวิตของคุณหมดลงแล้ว</p>

            <div class="bg-stone-800/90 rounded-2xl p-4 mb-6 border border-stone-700">
                <div class="text-stone-400 text-sm">คะแนนรวมทั้งหมด</div>
                <div id="final-score" class="text-5xl font-black text-amber-400 my-1">0</div>
            </div>

            <button id="restart-btn" class="w-full bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-lg transform active:scale-95 transition-all pointer-events-auto">
                เล่นใหม่อีกครั้ง 🔄
            </button>
        </div>
    </div>

    <!-- Canvas สำหรับวาดเกม -->
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <script>
        // --- 1. คลังคำศัพท์ภาษาจีน-ไทย ---
        const vocabularyDB = [
            { cn: "苹果", pinyin: "píngguǒ", th: "แอปเปิ้ล" },
            { cn: "香蕉", pinyin: "xiāngjiāo", th: "กล้วย" },
            { cn: "猫", pinyin: "māo", th: "แมว" },
            { cn: "狗", pinyin: "gǒu", th: "สุนัข" },
            { cn: "水", pinyin: "shuǐ", th: "น้ำ" },
            { cn: "火", pinyin: "huǒ", th: "ไฟ" },
            { cn: "书", pinyin: "shū", th: "หนังสือ" },
            { cn: "学校", pinyin: "xuéxiào", th: "โรงเรียน" },
            { cn: "老师", pinyin: "lǎoshī", th: "ครู" },
            { cn: "学生", pinyin: "xuésheng", th: "นักเรียน" },
            { cn: "朋友", pinyin: "péngyou", th: "เพื่อน" },
            { cn: "飞机", pinyin: "fēijī", th: "เครื่องบิน" },
            { cn: "汽车", pinyin: "qìchē", th: "รถยนต์" },
            { cn: "太阳", pinyin: "tàiyáng", th: "พระอาทิตย์" },
            { cn: "月亮", pinyin: "yuèliang", th: "พระจันทร์" },
            { cn: "牛奶", pinyin: "niúnǎi", th: "นมสด" },
            { cn: "面包", pinyin: "miànbāo", th: "ขนมปัง" },
            { cn: "中国", pinyin: "zhōngguó", th: "ประเทศจีน" },
            { cn: "泰国", pinyin: "tàiguó", th: "ประเทศไทย" },
            { cn: "爱", pinyin: "ài", th: "รัก" },
            { cn: "开心", pinyin: "kāixīn", th: "มีความสุข" },
            { cn: "医生", pinyin: "yīshēng", th: "หมอ" },
            { cn: "手机", pinyin: "shǒujī", th: "โทรศัพท์มือถือ" },
            { cn: "电脑", pinyin: "diànnǎo", th: "คอมพิวเตอร์" },
            { cn: "钱", pinyin: "qián", th: "เงิน" }
        ];

        // ชนิดผลไม้หลากสีสัน (8 ชนิด)
        const FRUIT_TYPES = [
            { name: 'watermelon', bg: '#15803d', inner: '#ef4444', border: '#166534', pColor: '#ef4444' },
            { name: 'orange', bg: '#ea580c', inner: '#ffedd5', border: '#c2410c', pColor: '#f97316' },
            { name: 'apple', bg: '#dc2626', inner: '#fef3c7', border: '#991b1b', pColor: '#ef4444' },
            { name: 'strawberry', bg: '#e11d48', inner: '#fecdd3', border: '#9f1239', pColor: '#fb7185' },
            { name: 'lemon', bg: '#eab308', inner: '#fef9c3', border: '#a16207', pColor: '#facc15' },
            { name: 'blueberry', bg: '#2563eb', inner: '#dbeafe', border: '#1e40af', pColor: '#60a5fa' },
            { name: 'dragonfruit', bg: '#db2777', inner: '#f1f5f9', border: '#9d174d', pColor: '#f472b6' },
            { name: 'kiwi', bg: '#65a30d', inner: '#ecfccb', border: '#3f6212', pColor: '#a3e635' }
        ];

        // --- 2. ระบบ Web Audio API สำหรับเอฟเฟกต์เสียง ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playSlice() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playBomb() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
            playWrong() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const soundFX = new SoundFX();

        // --- 3. การตั้งค่า Canvas และ ตัวแปรหลัก ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let lives = 5;
        let isGameOver = false;
        
        // ระบบจำกัดการเปลี่ยนคำศัพท์ (วนใช้คำศัพท์ในชุดเดิม 3 คำ)
        let currentWordSet = [];
        let currentTarget = null;
        let currentSetIndex = 0;

        let items = [];
        let fruitHalves = [];
        let particles = [];
        let slicePath = [];
        let isSlicing = false;
        let spawnTimer = 0;
        let spawnInterval = 130;

        let pendingSpawns = [];

        // ตัวแปรป้องกันการเสียชีวิตซ้ำซ้อน
        let lastDamageTime = 0;
        const DAMAGE_COOLDOWN = 500;

        // --- 4. คลาสสร้างวัตถุ (ผลไม้คำศัพท์ และ ระเบิด) ---
        class Item {
            constructor(wordObj = null, isBomb = false, spawnX = null) {
                this.radius = Math.min(width, height) * 0.082;
                if (this.radius < 50) this.radius = 50;
                if (this.radius > 75) this.radius = 75;

                this.x = spawnX !== null ? spawnX : Math.random() * (width - 160) + 80;
                this.y = height + this.radius;

                const speedMult = height / 800;

                const centerOffset = (this.x - width / 2) / (width / 2);
                this.vx = -centerOffset * (Math.random() * 3 + 1.5) + (Math.random() - 0.5) * 3;
                
                this.vy = -(Math.random() * 4.5 + 12) * speedMult;
                this.gravity = (Math.random() * 0.04 + 0.25) * speedMult;

                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.08;

                this.isBomb = isBomb;
                this.wordObj = wordObj; // { cn, pinyin, th }
                this.fruitType = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
                this.isSliced = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.isBomb) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#1c1917';
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#ef4444';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.quadraticCurveTo(10, -this.radius - 15, 15, -this.radius - 20);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#d97706';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(15, -this.radius - 20, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fill();

                    ctx.fillStyle = '#ef4444';
                    ctx.font = `bold ${this.radius * 0.85}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', 0, 2);
                } else {
                    const ft = this.fruitType;

                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = ft.bg;
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = ft.border;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.84, 0, Math.PI * 2);
                    ctx.fillStyle = ft.inner;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(0, -this.radius * 0.9, this.radius * 0.3, this.radius * 0.15, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#22c55e';
                    ctx.fill();

                    ctx.fillStyle = '#334155';
                    ctx.font = `bold ${this.radius * 0.28}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.wordObj.pinyin, 0, -this.radius * 0.32);

                    ctx.fillStyle = '#0f172a';
                    ctx.font = `bold ${this.radius * 0.55}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.wordObj.cn, 0, this.radius * 0.15);
                }

                ctx.restore();
            }
        }

        // --- 5. คลาสสำหรับผลไม้ที่ถูกฟันเป็น 2 ซีก ---
        class FruitHalf {
            constructor(x, y, radius, fruitType, isLeft, sliceAngle) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.fruitType = fruitType;
                this.isLeft = isLeft;
                this.rotation = sliceAngle;

                const pushDir = isLeft ? -1 : 1;
                this.vx = pushDir * (Math.random() * 4 + 3);
                this.vy = -(Math.random() * 3 + 2);
                this.vRot = pushDir * (Math.random() * 0.1 + 0.05);
                this.gravity = 0.35;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
                this.alpha -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const ft = this.fruitType;
                ctx.beginPath();
                if (this.isLeft) {
                    ctx.arc(0, 0, this.radius, Math.PI * 0.5, Math.PI * 1.5);
                } else {
                    ctx.arc(0, 0, this.radius, Math.PI * 1.5, Math.PI * 0.5);
                }
                ctx.closePath();
                ctx.fillStyle = ft.bg;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = ft.border;
                ctx.stroke();

                ctx.beginPath();
                if (this.isLeft) {
                    ctx.arc(0, 0, this.radius * 0.8, Math.PI * 0.5, Math.PI * 1.5);
                } else {
                    ctx.arc(0, 0, this.radius * 0.8, Math.PI * 1.5, Math.PI * 0.5);
                }
                ctx.fillStyle = ft.inner;
                ctx.fill();

                ctx.restore();
            }
        }

        // --- 6. คลาสสำหรับอนุภาคกระจาย (Particles) ---
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 5 + 2;
                this.vx = (Math.random() - 0.5) * 14;
                this.vy = (Math.random() - 0.5) * 14;
                this.alpha = 1;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 7. วาดฉากหลังโรงฝึกนินจาไม้โบราณ ---
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#29180e');
            grad.addColorStop(0.5, '#452715');
            grad.addColorStop(1, '#1c0d06');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = '#180a04';
            ctx.lineWidth = 3;
            const plankWidth = 80;
            for (let x = 0; x < width; x += plankWidth) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            const lightGrad = ctx.createRadialGradient(width / 2, height / 3, 50, width / 2, height / 3, width * 0.7);
            lightGrad.addColorStop(0, 'rgba(251, 191, 36, 0.12)');
            lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = lightGrad;
            ctx.fillRect(0, 0, width, height);
        }

        // --- 8. ระบบสุ่มเป้าหมายคำศัพท์แบบจำกัด (หมุนวนในชุด 3 คำเดิม) ---
        function generateNewWordSet() {
            // สุ่ม 3 คำศัพท์ใหม่มาจากคลัง
            const shuffled = [...vocabularyDB].sort(() => Math.random() - 0.5);
            currentWordSet = shuffled.slice(0, 3);
            currentSetIndex = 0;
            updateTargetUI();
        }

        function advanceTarget() {
            currentSetIndex++;
            if (currentSetIndex >= currentWordSet.length) {
                // ทบทวนครบ 3 คำแล้ว ค่อยเปลี่ยนชุดคำศัพท์ใหม่
                generateNewWordSet();
            } else {
                updateTargetUI();
            }
        }

        function updateTargetUI() {
            currentTarget = currentWordSet[currentSetIndex];
            document.getElementById('target-word').innerText = currentTarget.th;
            document.getElementById('target-pinyin').innerText = `(${currentTarget.pinyin})`;
            document.getElementById('set-progress').innerText = `ทบทวนคำศัพท์ในชุด: ${currentSetIndex + 1}/3`;
        }

        // --- 9. การรับฟันคำและเช็คการชน (Slice & Collision) ---
        function checkSliceCollision(x1, y1, x2, y2) {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                if (item.isSliced) continue;

                const dist = distToSegment({ x: item.x, y: item.y }, { x: x1, y: y1 }, { x: x2, y: y2 });

                if (dist < item.radius) {
                    item.isSliced = true;

                    if (item.isBomb) {
                        createParticles(item.x, item.y, '#ef4444');
                        soundFX.playBomb();
                        loseLife("คุณฟันโดนระเบิด! 💣");
                    } else {
                        const angle = Math.atan2(y2 - y1, x2 - x1);
                        fruitHalves.push(new FruitHalf(item.x, item.y, item.radius, item.fruitType, true, angle));
                        fruitHalves.push(new FruitHalf(item.x, item.y, item.radius, item.fruitType, false, angle));

                        createParticles(item.x, item.y, item.fruitType.pColor);

                        if (item.wordObj.cn === currentTarget.cn) {
                            soundFX.playHit();
                            score += 10;
                            document.getElementById('score-val').innerText = score;
                            
                            // ขยับเป้าหมาย (วนในชุดเดิมจนครบ 3 คำ)
                            advanceTarget();

                            if (score % 50 === 0 && spawnInterval > 80) {
                                spawnInterval -= 5;
                            }
                        } else {
                            soundFX.playWrong();
                            loseLife("ฟันผิดคำศัพท์! ❌");
                        }
                    }

                    items.splice(i, 1);
                }
            }
        }

        function distToSegment(p, v, w) {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 22; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function loseLife(reason = "ชีวิตของคุณหมดลงแล้ว! 💔") {
            const now = Date.now();
            if (now - lastDamageTime < DAMAGE_COOLDOWN) {
                return;
            }
            lastDamageTime = now;

            lives--;
            updateLivesUI();
            triggerDamageFlash();

            if (lives <= 0) {
                gameOver(reason);
            }
        }

        function triggerDamageFlash() {
            const flash = document.getElementById('damage-flash');
            flash.classList.remove('damage-overlay');
            void flash.offsetWidth;
            flash.classList.add('damage-overlay');
        }

        function updateLivesUI() {
            const container = document.getElementById('lives-container');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.innerText = i < lives ? '❤️' : '🖤';
                container.appendChild(heart);
            }
        }

        // --- 10. ลูปหลักของเกม (Game Loop) ---
        function gameLoop() {
            if (isGameOver) return;

            drawBackground();

            processPendingSpawns();

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                scheduleWave();
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                // เมื่อคำศัพท์ตกขอบล่างไป ปรับให้ "ไม่เสียชีวิต" แล้วลบออกได้เลย
                if (item.y - item.radius > height + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = fruitHalves.length - 1; i >= 0; i--) {
                const fh = fruitHalves[i];
                fh.update();
                fh.draw();
                if (fh.alpha <= 0 || fh.y > height + 100) {
                    fruitHalves.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            drawSliceTrail();

            requestAnimationFrame(gameLoop);
        }

        // วางแผนสร้างชุดคำศัพท์ขึ้นมา
        function scheduleWave() {
            const count = Math.floor(Math.random() * 3) + 2; // 2 - 4 ลูกต่อรอบ
            const includeTarget = Math.random() < 0.75; 
            let targetInserted = false;

            const zones = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
            const zoneWidth = (width - 160) / 4;

            for (let i = 0; i < count; i++) {
                const zone = zones[i % 4];
                const spawnX = 80 + zone * zoneWidth + Math.random() * (zoneWidth - 20);
                
                const delayFrames = Math.floor(Math.random() * 25) + i * 8;

                const isBomb = Math.random() < 0.1; // ระเบิดประมาณ 10%

                let selectedWord = null;
                if (!isBomb) {
                    if (includeTarget && !targetInserted) {
                        selectedWord = currentTarget;
                        targetInserted = true;
                    } else {
                        // สุ่มคำศัพท์อื่นเป็นตัวหลอก
                        let wrongWords = vocabularyDB.filter(v => v.cn !== currentTarget.cn);
                        selectedWord = wrongWords[Math.floor(Math.random() * wrongWords.length)];
                    }
                }

                pendingSpawns.push({
                    delay: delayFrames,
                    wordObj: selectedWord,
                    isBomb: isBomb,
                    spawnX: spawnX
                });
            }
        }

        function processPendingSpawns() {
            for (let i = pendingSpawns.length - 1; i >= 0; i--) {
                const p = pendingSpawns[i];
                p.delay--;
                if (p.delay <= 0) {
                    items.push(new Item(p.wordObj, p.isBomb, p.spawnX));
                    pendingSpawns.splice(i, 1);
                }
            }
        }

        function drawSliceTrail() {
            if (slicePath.length < 2) return;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(slicePath[0].x, slicePath[0].y);

            for (let i = 1; i < slicePath.length; i++) {
                ctx.lineTo(slicePath[i].x, slicePath[i].y);
            }

            ctx.lineWidth = 7;
            ctx.strokeStyle = '#fef08a';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 15;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();

            if (slicePath.length > 8) {
                slicePath.shift();
            }
        }

        // --- 11. การจับเหตุการณ์เมาส์และทัชสกรีน (Events) ---
        function handlePointerDown(e) {
            soundFX.init();
            isSlicing = true;
            slicePath = [];
            const pos = getPointerPos(e);
            slicePath.push(pos);
        }

        function handlePointerMove(e) {
            if (!isSlicing) return;
            const pos = getPointerPos(e);
            slicePath.push(pos);

            if (slicePath.length >= 2) {
                const p1 = slicePath[slicePath.length - 2];
                const p2 = slicePath[slicePath.length - 1];
                soundFX.playSlice();
                checkSliceCollision(p1.x, p1.y, p2.x, p2.y);
            }
        }

        function handlePointerUp() {
            isSlicing = false;
            slicePath = [];
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        // --- 12. ระบบควบคุมสถานะเกม (Game Control) ---
        function startGame() {
            score = 0;
            lives = 5;
            spawnInterval = 130;
            isGameOver = false;
            lastDamageTime = 0;
            items = [];
            fruitHalves = [];
            particles = [];
            slicePath = [];
            pendingSpawns = [];

            document.getElementById('score-val').innerText = '0';
            document.getElementById('game-over-modal').classList.add('hidden');
            updateLivesUI();
            
            // สร้างคำศัพท์ 3 คำสำหรับหมุนวนชุดแรก
            generateNewWordSet();
            
            requestAnimationFrame(gameLoop);
        }

        function gameOver(reason) {
            isGameOver = true;
            document.getElementById('game-over-reason').innerText = reason;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        document.getElementById('restart-btn').addEventListener('click', startGame);

        startGame();
    </script>
</body>
